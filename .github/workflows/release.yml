name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check formatting
        shell: bash
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "${UNFORMATTED}" ]; then
            echo "::error::The following Go files are not formatted:"
            printf '%s\n' "${UNFORMATTED}"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Register module with Go proxy
        shell: bash
        run: |
          MODULE="github.com/mailengin/mailengin-go-sdk@${GITHUB_REF_NAME}"
          for ATTEMPT in 1 2 3 4 5 6; do
            if GOPROXY=https://proxy.golang.org go list -m "${MODULE}"; then
              exit 0
            fi

            if [ "${ATTEMPT}" -eq 6 ]; then
              echo "::error::The Go proxy could not resolve ${MODULE} after ${ATTEMPT} attempts."
              exit 1
            fi

            echo "Go proxy has not indexed ${MODULE} yet; retrying in 20 seconds."
            sleep 20
          done
